<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@200;300;400&family=Geist:wght@200;300;400;500&display=swap');

    :root {
      --bg: #030303;
      --text: #e4e4e7;
      --text-muted: #52525b;
      --accent: #ffffff;
      --font-sans: 'Geist', sans-serif;
      --font-mono: 'Geist Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .system-title {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    h1 {
      font-size: 14px;
      font-weight: 400;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .challenge-area {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .equation {
      font-family: var(--font-mono);
      font-size: 32px;
      font-weight: 200;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .form-row {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="number"] {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid #27272a;
      color: #ffffff;
      padding: 12px 40px 12px 0;
      font-size: 18px;
      font-family: var(--font-mono);
      outline: none;
      transition: border-color 0.3s ease;
    }

    input[type="number"]:focus {
      border-color: var(--accent);
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .submit-arrow {
      position: absolute;
      right: 0;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease;
    }

    input[type="number"]:focus + .submit-arrow,
    .submit-arrow:hover {
      color: #ffffff;
    }

    .sponsorship {
      margin-top: 40px;
      border-top: 1px solid #18181b;
      padding-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sponsor-title {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .sponsor-desc {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .sponsor-desc span {
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="system-title">verification</div>
      <h1>計算結果を入力してください。</h1>
    </header>

    <div class="challenge-area">
      <div class="equation">
        <%= mathQuestion %>
      </div>

      <form action="/api/auth/verify-captcha" method="POST">
        <input type="hidden" name="token" value="<%= token %>">
        <div class="form-row">
          <input type="number" name="answer" required autofocus placeholder="?" autocomplete="off">
          <button type="submit" class="submit-arrow" aria-label="Submit">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>
      </form>
    </div>

    <div class="sponsorship">
      <div class="sponsor-title">infrastructure</div>
      <p class="sponsor-desc">このシステムは <span>Kura</span> のドメイン提供により運用されています。</p>
    </div>
  </div>
</body>
</html>
