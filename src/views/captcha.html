<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@200;300;400&family=Geist:wght@200;300;400;500&display=swap');

    :root {
      --bg: #030303;
      --text: #e4e4e7;
      --text-muted: #52525b;
      --font-sans: 'Geist', sans-serif;
      --font-mono: 'Geist Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 40px;
      position: relative;
      z-index: 1;
    }

    .screen {
      display: none;
      flex-direction: column;
      gap: 28px;
      animation: fadeIn 0.4s ease forwards;
    }
    .screen.active { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    h1 {
      font-size: 16px;
      font-weight: 400;
      color: #fff;
      line-height: 1.5;
    }

    p {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.7;
    }

    /* ── hold wrapper ── */
    .hold-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      padding: 16px 0;
    }

    .hold-area {
      position: relative;
      width: 176px;
      height: 176px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* pulse rings */
    .pulse-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0);
      inset: -16px;
      pointer-events: none;
      transition: border-color 0.4s;
    }
    .pulse-ring-2 {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0);
      inset: -6px;
      pointer-events: none;
      transition: border-color 0.4s;
    }
    .holding .pulse-ring   { border-color: rgba(255,255,255,0.07); animation: pulse 1.6s ease-out infinite; }
    .holding .pulse-ring-2 { border-color: rgba(255,255,255,0.05); animation: pulse 1.6s ease-out 0.55s infinite; }

    @keyframes pulse {
      0%   { transform: scale(0.94); opacity: 1; }
      100% { transform: scale(1.18); opacity: 0; }
    }

    /* SVG rings */
    .rings-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    .ring-static {
      fill: none;
      stroke: rgba(255,255,255,0.05);
      stroke-width: 1;
    }

    .ring-dash-cw {
      fill: none;
      stroke: rgba(255,255,255,0);
      stroke-width: 1;
      stroke-dasharray: 5 10;
      transition: stroke 0.4s;
      transform-origin: 88px 88px;
    }
    .holding .ring-dash-cw {
      stroke: rgba(255,255,255,0.28);
      animation: spin-cw 5s linear infinite;
    }

    .ring-dash-ccw {
      fill: none;
      stroke: rgba(255,255,255,0);
      stroke-width: 1;
      stroke-dasharray: 3 14;
      transition: stroke 0.4s;
      transform-origin: 88px 88px;
    }
    .holding .ring-dash-ccw {
      stroke: rgba(255,255,255,0.14);
      animation: spin-ccw 3.5s linear infinite;
    }

    @keyframes spin-cw  { to { transform: rotate(360deg); } }
    @keyframes spin-ccw { to { transform: rotate(-360deg); } }

    /* progress arc */
    .progress-arc {
      fill: none;
      stroke: #fff;
      stroke-width: 1.5;
      stroke-linecap: round;
      transform-origin: 88px 88px;
      rotate: -90deg;
      transition: filter 0.4s;
    }
    .holding .progress-arc {
      filter: drop-shadow(0 0 5px rgba(255,255,255,0.55)) drop-shadow(0 0 12px rgba(255,255,255,0.2));
    }

    /* center button */
    .hold-btn {
      position: relative;
      width: 108px;
      height: 108px;
      border-radius: 50%;
      border: 1px solid #1c1c1f;
      background: #080808;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.3s, box-shadow 0.4s;
      overflow: hidden;
      z-index: 2;
    }
    .hold-btn.holding {
      border-color: #2c2c30;
      box-shadow: 0 0 28px rgba(255,255,255,0.04), 0 0 56px rgba(255,255,255,0.015), inset 0 0 20px rgba(255,255,255,0.02);
    }
    .hold-btn.done {
      border-color: #404044;
      box-shadow: 0 0 40px rgba(255,255,255,0.09);
    }

    /* scan line inside button */
    .scan-line {
      position: absolute;
      left: 6px;
      right: 6px;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.55) 40%, rgba(255,255,255,0.9) 50%, rgba(255,255,255,0.55) 60%, transparent 100%);
      opacity: 0;
      pointer-events: none;
      border-radius: 1px;
      transition: opacity 0.3s;
    }
    .holding .scan-line {
      opacity: 1;
      animation: scan 1.1s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    @keyframes scan {
      0%   { top: 12px; }
      50%  { top: calc(100% - 12px); }
      100% { top: 12px; }
    }

    /* hand icon */
    .hand-icon {
      color: #363639;
      transition: color 0.3s, transform 0.3s;
      pointer-events: none;
    }
    .hold-btn.holding .hand-icon { color: #909094; transform: translateY(-1px); }
    .hold-btn.done    .hand-icon { color: #e4e4e7; }

    /* status */
    .status-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      min-height: 36px;
    }

    .hold-hint {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      transition: color 0.3s;
    }
    .active-state .hold-hint { color: #71717a; }

    .hex-stream {
      font-family: var(--font-mono);
      font-size: 9px;
      color: #27272a;
      letter-spacing: 0.04em;
      height: 13px;
      opacity: 0;
      transition: opacity 0.3s;
      white-space: nowrap;
    }
    .active-state .hex-stream { opacity: 1; }

    /* progress bar (linear) under button */
    .progress-bar-track {
      width: 100%;
      height: 1px;
      background: #18181b;
      border-radius: 1px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #fff;
      border-radius: 1px;
      transition: width 0.05s linear, box-shadow 0.4s;
    }
    .active-state .progress-bar-fill {
      box-shadow: 0 0 6px rgba(255,255,255,0.5);
    }

    /* ── confirm screen ── */
    .btn-row {
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      font-family: var(--font-sans);
      font-size: 12px;
      padding: 11px;
      border-radius: 4px;
      border: 1px solid #27272a;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .btn:hover { border-color: #52525b; }
    .btn.primary {
      background: #fff;
      color: #000;
      border-color: #fff;
    }
    .btn.primary:hover { background: #e4e4e7; border-color: #e4e4e7; }

    /* ── sponsorship ── */
    .sponsorship {
      border-top: 1px solid #18181b;
      padding-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sponsor-title {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .sponsor-desc { font-size: 11px; color: var(--text-muted); line-height: 1.5; }
    .sponsor-desc span { color: var(--text); }
  </style>
</head>
<body>
  <div class="container">

    <!-- HOLD SCREEN -->
    <div class="screen active" id="screen-hold">
      <div class="label">verification</div>
      <h1>長押しして続行してください。</h1>
      <p>ボタンを長押しして、ロボットでないことを確認します。</p>

      <div class="hold-wrapper">
        <div class="hold-area" id="holdArea">
          <div class="pulse-ring"></div>
          <div class="pulse-ring-2"></div>

          <svg class="rings-svg" viewBox="0 0 176 176">
            <circle class="ring-static"   cx="88" cy="88" r="84"/>
            <circle class="ring-dash-cw"  cx="88" cy="88" r="84"/>
            <circle class="ring-dash-ccw" cx="88" cy="88" r="71"/>
            <circle
              id="progressArc"
              class="progress-arc"
              cx="88" cy="88" r="78"
            />
          </svg>

          <button class="hold-btn" id="holdBtn" type="button" aria-label="長押しして認証">
            <div class="scan-line"></div>
            <svg class="hand-icon" width="30" height="30" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 11V6.5a2.5 2.5 0 0 0-5 0V12m0 0V6.5a2.5 2.5 0 0 0-5 0V12m0 0V8.5a2.5 2.5 0 0 0-5 0V16a6 6 0 0 0 6 6h2a6 6 0 0 0 6-6v-1.5a2.5 2.5 0 0 0-5 0"/>
            </svg>
          </button>
        </div>

        <div class="status-area" id="statusArea">
          <span class="hold-hint" id="holdHint">press and hold</span>
          <span class="hex-stream" id="hexStream"></span>
        </div>

        <div class="progress-bar-track" style="width:176px">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
      </div>
    </div>

    <!-- CONFIRM SCREEN -->
    <div class="screen" id="screen-confirm">
      <div class="label">confirmation</div>
      <h1>認証しますか？</h1>
      <p>Discordアカウントとの連携を続行します。</p>

      <form method="POST" action="/api/auth/verify-captcha">
        <input type="hidden" name="token" value="<%= token %>">
        <div class="btn-row">
          <button type="button" class="btn" id="cancelBtn">いいえ</button>
          <button type="submit" class="btn primary">はい</button>
        </div>
      </form>
    </div>

    <div class="sponsorship">
      <div class="sponsor-title">infrastructure</div>
      <p class="sponsor-desc">このシステムは <span>Kura</span> のドメイン提供により運用されています。</p>
    </div>

  </div>

  <script>
    const holdBtn     = document.getElementById('holdBtn');
    const holdArea    = document.getElementById('holdArea');
    const statusArea  = document.getElementById('statusArea');
    const progressArc = document.getElementById('progressArc');
    const progressBar = document.getElementById('progressBar');
    const holdHint    = document.getElementById('holdHint');
    const hexStream   = document.getElementById('hexStream');
    const screenHold  = document.getElementById('screen-hold');
    const screenConfirm = document.getElementById('screen-confirm');
    const cancelBtn   = document.getElementById('cancelBtn');

    const HOLD_MS     = 2500;
    const R           = 78;
    const CIRC        = 2 * Math.PI * R;

    progressArc.style.strokeDasharray  = CIRC;
    progressArc.style.strokeDashoffset = CIRC;

    let holdStart   = null;
    let rafId       = null;
    let hexInterval = null;

    const HEX = '0123456789abcdef';
    function randHex(n) {
      let s = '';
      for (let i = 0; i < n; i++) s += HEX[Math.random() * 16 | 0];
      return s;
    }

    function setProgress(r) {
      progressArc.style.strokeDashoffset = CIRC * (1 - r);
      progressBar.style.width = (r * 100) + '%';
    }

    function startHold() {
      if (holdStart !== null) return;
      holdStart = performance.now();
      holdBtn.classList.add('holding');
      holdArea.classList.add('holding');
      statusArea.classList.add('active-state');
      holdHint.textContent = 'verifying...';
      hexInterval = setInterval(() => { hexStream.textContent = randHex(32); }, 70);
      rafId = requestAnimationFrame(tick);
    }

    function tick(now) {
      if (holdStart === null) return;
      const ratio = Math.min((now - holdStart) / HOLD_MS, 1);
      setProgress(ratio);
      ratio >= 1 ? completeHold() : (rafId = requestAnimationFrame(tick));
    }

    function releaseHold() {
      if (holdStart === null) return;
      holdStart = null;
      cancelAnimationFrame(rafId);
      clearInterval(hexInterval);
      holdBtn.classList.remove('holding');
      holdArea.classList.remove('holding');
      statusArea.classList.remove('active-state');
      holdHint.textContent = 'press and hold';
      hexStream.textContent = '';
      setProgress(0);
    }

    function completeHold() {
      holdStart = null;
      cancelAnimationFrame(rafId);
      clearInterval(hexInterval);
      holdBtn.classList.remove('holding');
      holdBtn.classList.add('done');
      holdArea.classList.remove('holding');
      statusArea.classList.remove('active-state');
      hexStream.textContent = '';
      setProgress(1);
      setTimeout(() => {
        screenHold.classList.remove('active');
        screenConfirm.classList.add('active');
      }, 320);
    }

    holdBtn.addEventListener('mousedown',   (e) => { e.preventDefault(); startHold(); });
    document.addEventListener('mouseup',    () => releaseHold());
    document.addEventListener('mouseleave', () => releaseHold());

    holdBtn.addEventListener('touchstart',  (e) => { e.preventDefault(); startHold(); }, { passive: false });
    document.addEventListener('touchend',   () => releaseHold());
    document.addEventListener('touchcancel', () => releaseHold());

    cancelBtn.addEventListener('click', () => {
      screenConfirm.classList.remove('active');
      holdBtn.classList.remove('done');
      setProgress(0);
      holdHint.textContent = 'press and hold';
      screenHold.classList.add('active');
    });
  </script>
</body>
</html>
